# 설계서 v0.1.25 §11 — 공개 URL 부록 A 12건 캡처(운영자 2026-11-05, Phase 4 완료 기준 "실호출 12건 캡처"·"answer_log 12행").
# 수동 실행만. 공개 데모 세션으로 /me/ask 12건(60초 간격) → 응답 JSON·answerId·GET /answers/{id}(원격 answer_log 행, violations 포함)를
# docs/evidence/captures/phase-4-public/에 쓰고 bot/capture-public 브랜치에 커밋한다(main 푸시는 운영자).
# 질문마다 Workers AI(질문 임베딩)·Groq를 부른다 — daily-explain 뒤에 운영자 지시로 실행. 시크릿을 쓰지 않는다.
name: capture-public

on:
  workflow_dispatch:
    inputs:
      expect_answer:
        description: "배포된 활성 answer 버전(다르면 질문하지 않고 멈춘다)"
        type: string
        default: "v3"

concurrency:
  group: capture-public
  cancel-in-progress: false

permissions:
  contents: read

env:
  BASE: https://ga-commission-copilot.ga-copilot-demo.workers.dev
  OUT: docs/evidence/captures/phase-4-public
  BOT_BRANCH: bot/capture-public

defaults:
  run:
    shell: bash

jobs:
  capture:
    if: github.repository == 'hjryoo-ai/ga-commission-copilot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false # 쓰기 토큰은 마지막 푸시 단계에만

      - name: bot/capture-public(main에서 — 있으면 이어서 main을 합친다)
        id: branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$BOT_BRANCH" > /dev/null; then
            git fetch origin "$BOT_BRANCH"
            git checkout -B "$BOT_BRANCH" "origin/$BOT_BRANCH"
            git merge --no-edit origin/main
          else
            git checkout -b "$BOT_BRANCH"
          fi

      - name: 공개 URL 12건(/demo/session → /me 버전 확인 → /me/ask × 12 → /answers/{id})
        env:
          EXPECT: ${{ inputs.expect_answer }}
        run: |
          mkdir -p "$OUT"
          python3 -X utf8 -I gen/scripts/capture-public.py "$BASE" "$OUT" "$EXPECT" 2>&1 | tee "$OUT/capture.txt" # .log는 .gitignore(*.log)에 걸려 커밋되지 않는다(2026-11-06 첫 실행)

      - name: 요약
        if: always() && steps.branch.outcome == 'success'
        run: |
          [ -f "$OUT/index.json" ] || exit 0
          {
            echo "### 공개 URL 캡처"
            echo
            echo '| 질문 | HTTP | 거부 | 사유 | 검증 | 버전 | 위반(G1·G4·G5·G6 수) |'
            echo '|---|---|---|---|---|---|---|'
            node -e 'const x=require(process.argv[1]);for(const c of x.cases){const v=c.violations;console.log(`| ${c.case} | ${c.httpStatus} | ${c.refused} | ${c.reason??""} | ${c.groundingStatus??""} | ${c.promptVersion??""} | ${v?[(v.g1Shape??[]).length,v.g4Missing.length,v.g5Unknown.length,v.g6Words.length].join("·"):"없음"} |`)}' "$PWD/$OUT/index.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 커밋·bot/capture-public 푸시
        if: always() && steps.branch.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git add "$OUT"
          if git diff --cached --quiet; then
            echo "바뀐 것 없음"
            exit 0
          fi
          git commit -m "phase-4: 공개 URL 부록 A 12건 캡처 $(date -u +%F)(capture-public)" -m "$RUN_URL"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push origin "HEAD:$BOT_BRANCH"
