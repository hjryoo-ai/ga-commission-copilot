# 설계서 v0.1.32 §11 — 부록 A 12건 캡처, **로컬 대상(공개 URL 캡처가 아니다)**. v0.1.25의 capture-public.yml을 바꿨다(운영자 2026-11-07):
# 배포에 Turnstile이 켜져 자동 클라이언트는 공개 URL /ask를 쓸 수 없고(403), 우회 경로는 만들지 않는다. 공개 URL 동작 증거는 사람이 브라우저로 1회 찍는다(PHASES Phase 5 완료 기준).
# 수동 실행만. CI 안에서 wrangler dev --env record(D1 로컬·Vectorize·AI 원격 — record-answer와 같은 서버, TURNSTILE_SECRET·LLM_TRACE 없음)를 띄우고
# /demo/session → /me 버전 확인 → /me/ask 12건(60초 간격 — Groq TPM 8K, 분당 3회 레이트 리밋 안) → /answers/{id}(로컬 answer_log 행, violations 포함)를
# docs/evidence/captures/capture-local/<UTC 날>/에 쓰고 bot/capture-local 브랜치에 커밋한다(main 푸시는 운영자).
# 질문마다 Workers AI(질문 임베딩)·Groq를 부른다 — daily-explain(설명 배치) 뒤에 운영자 지시로 실행.
name: capture-local

on:
  workflow_dispatch:
    inputs:
      expect_answer:
        description: "wrangler.jsonc의 활성 answer 버전(다르면 질문하지 않고 멈춘다)"
        type: string
        default: "v3"

concurrency:
  group: capture-local
  cancel-in-progress: false

permissions:
  contents: read

env:
  BASE: http://localhost:8799
  BOT_BRANCH: bot/capture-local

defaults:
  run:
    shell: bash

jobs:
  capture:
    if: github.repository == 'hjryoo-ai/ga-commission-copilot'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false # 쓰기 토큰은 마지막 푸시 단계에만

      # 서드파티 액션은 SHA로 고정(시크릿·contents: write를 쓰는 워크플로)
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: bot/capture-local(main에서 — 있으면 이어서 main을 합친다)
        id: branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$BOT_BRANCH" > /dev/null; then
            git fetch origin "$BOT_BRANCH"
            git checkout -B "$BOT_BRANCH" "origin/$BOT_BRANCH"
            git merge --no-edit origin/main
          else
            git checkout -b "$BOT_BRANCH"
          fi
          echo "OUT=docs/evidence/captures/capture-local/$(date -u +%F)" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      # viewsOf(load:d1)는 빌드하지 않는다 — ci.yml과 같은 스텝
      - name: projection-java installDist
        run: pnpm run build:replay

      - name: 로컬 D1 준비(마이그레이션 → 스트림 → 사규집 청크 → 시뮬레이션 스텁)
        working-directory: gen
        run: |
          pnpm --dir ../worker exec wrangler d1 migrations apply copilot --local
          pnpm run load:d1 -- --local
          pnpm run load:d1 -- --local --rulebook
          pnpm run load:d1 -- --local --sim-stub

      - name: .dev.vars.record(값은 출력하지 않는다 — 세션·policyKey 비밀은 이 실행에서만 쓰는 무작위, TURNSTILE_SECRET·LLM_TRACE 없음)
        working-directory: worker
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          test -n "$GROQ_API_KEY" || { echo "GROQ_API_KEY 시크릿 없음"; exit 1; }
          umask 077
          {
            printf 'GROQ_API_KEY=%s\n' "$GROQ_API_KEY"
            printf 'SESSION_SECRET=%s\n' "$(openssl rand -hex 32)"
            printf 'POLICY_KEY_SECRET=%s\n' "$(openssl rand -hex 32)"
          } > .dev.vars.record

      # 12건이 한 IP("local")라 사용자 상한(BUDGET_USER 10)을 이 서버에만 20으로 — 설정 파일은 그대로(설계서 v0.1.32)
      - name: 로컬 서버(wrangler dev --env record — D1 로컬, Vectorize·AI 원격, --local 금지)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BATCH_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p "../$OUT"
          nohup pnpm exec wrangler dev --env record --port 8799 --var BUDGET_USER:20 > "../$OUT/server.txt" 2>&1 &
          for _ in $(seq 1 90); do
            curl -fsS "$BASE/api/v1/health" > /dev/null 2>&1 && { curl -sS "$BASE/api/v1/health"; echo; exit 0; }
            sleep 2
          done
          tail -50 "../$OUT/server.txt"
          exit 1

      - name: 부록 A 12건(/demo/session → /me 버전 확인 → /me/ask × 12 → /answers/{id})
        env:
          EXPECT: ${{ inputs.expect_answer }}
        run: |
          python3 -X utf8 -I gen/scripts/capture-local.py "$BASE" "$OUT" "$EXPECT" 2>&1 | tee "$OUT/capture.txt" # .log는 .gitignore(*.log)에 걸린다
          pkill -f "wrangler dev --env record" || true

      - name: 계정 ID 가리기
        if: always() && steps.branch.outcome == 'success'
        env:
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$ACCOUNT" ] || exit 0
          for f in "$OUT"/*.txt; do
            if [ -f "$f" ]; then sed -i "s/$ACCOUNT/<account>/g" "$f"; fi
          done

      - name: 요약
        if: always() && steps.branch.outcome == 'success'
        run: |
          [ -f "$OUT/index.json" ] || exit 0
          {
            echo "### 로컬 캡처(wrangler dev --env record — 공개 URL 아님)"
            echo
            echo '| 질문 | HTTP | 거부 | 사유 | 검증 | 버전 | 위반(G1·G4·G5·G6 수) |'
            echo '|---|---|---|---|---|---|---|'
            node -e 'const x=require(process.argv[1]);for(const c of x.cases){const v=c.violations;console.log(`| ${c.case} | ${c.httpStatus} | ${c.refused} | ${c.reason??""} | ${c.groundingStatus??""} | ${c.promptVersion??""} | ${v?[(v.g1Shape??[]).length,v.g4Missing.length,v.g5Unknown.length,v.g6Words.length].join("·"):"없음"} |`)}' "$PWD/$OUT/index.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 커밋·bot/capture-local 푸시
        if: always() && steps.branch.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git add "$OUT"
          if git diff --cached --quiet; then
            echo "바뀐 것 없음"
            exit 0
          fi
          git commit -m "phase-5: 부록 A 12건 로컬 캡처 $(date -u +%F)(capture-local — 공개 URL 아님)" -m "$RUN_URL"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push origin "HEAD:$BOT_BRANCH"
